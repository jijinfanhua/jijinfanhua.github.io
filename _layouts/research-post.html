---
layout: research-site
---
<article class="post">
  <header class="page-head">
    <p><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time></p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
</article>
