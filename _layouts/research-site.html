<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.url == '/' %}Yong Feng — AI Infrastructure{% else %}{{ page.title | escape }} · Yong Feng{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="Yong Feng’s blog">
  <link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">
  {% include analytics.html %}
</head>
<body id="top">
  <a class="skip" href="#main">Skip to content</a>
  <header class="shell bar">
    <a class="signature" href="{{ '/' | relative_url }}" aria-label="Yong Feng, home">
      <span class="signature-lockup">
        <span class="signature-name">Yong Feng</span>
        <span class="signature-stamp" aria-hidden="true"></span>
      </span>
    </a>
    <nav aria-label="Main">
      <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Profile</a>
      <a {% if page.url == '/publications/' %}aria-current="page"{% endif %} href="{{ '/publications/' | relative_url }}">Publications</a>
      <a {% if page.url contains '/blog/' %}aria-current="{% if page.url == '/blog/' %}page{% else %}location{% endif %}"{% endif %} href="{{ '/blog/' | relative_url }}">Blog</a>
    </nav>
  </header>
  <main class="shell" id="main">
    {{ content }}
  </main>
  <footer class="shell footer"><span>Yong Feng <span lang="zh">冯勇</span></span><a href="#top">Back to top</a></footer>
</body>
</html>
